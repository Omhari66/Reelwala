[project]
name = "reelwala"
version = "0.1.0"
description = "Reelwala (CreatorOps): WhatsApp-first AI Reel generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "rq>=1.16.1",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.4",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
